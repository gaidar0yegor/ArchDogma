[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archdogma"
version = "0.4.0"
description = "Honest static analysis for Python — function, module and git-history detectors, each linked to a catalogued postmortem. The catalog is the point; the scanner finds it in your code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Yegor Gaidar", email = "maingaidar@gmail.com" },
]
keywords = [
    "static-analysis",
    "ast",
    "code-review",
    "accessibility",
    "programming-dogmas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
# Core stays at two: click (CLI) and pyyaml (the catalog is YAML per
# ADR-002). Everything else is an extra — the analyzers themselves are
# pure stdlib, and the package should not install a TTS engine on a CI
# runner that will never speak.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/gaidar0yegor/ArchDogma"
Repository = "https://github.com/gaidar0yegor/ArchDogma"
Issues = "https://github.com/gaidar0yegor/ArchDogma/issues"
Changelog = "https://github.com/gaidar0yegor/ArchDogma/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The `git` extra held gitpython, planned in ADR-001 for Tier 3. Tier 3
# shipped in 0.3.0 using `subprocess` and one `git log` call, so the extra
# installed a dependency nothing imports. Removed rather than left as a
# no-op install — see ADR-003.
#
# voice: pyttsx3 is only the LAST-RESORT TTS backend. On macOS (`say`) and
# Linux (`espeak-ng`) voice mode works with no extra at all; the extra
# matters on Windows or on systems with no native TTS binary.
voice = [
    "pyttsx3>=2.90",
]
# pretty: rich powers the opt-in --pretty rendering. Without it the CLI
# falls back to the plain output, which is the accessibility contract's
# default anyway (ADR-001).
pretty = [
    "rich>=13.7",
]
# mcp: the official Model Context Protocol SDK, for `archdogma mcp` — the
# server that lets coding agents call the scanners and read the catalog.
mcp = [
    # >=2.0: build_server imports mcp.server.mcpserver.MCPServer, which is
    # the 2.0 API. A 1.x floor would satisfy pip while the import fails,
    # producing an error telling users to install what they already have.
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    # Tests exercise --pretty, the pyttsx3 fallback path, and the MCP
    # server wiring, so dev pulls the extras' packages in explicitly.
    "rich>=13.7",
    "pyttsx3>=2.90",
    "mcp>=2.0",
]

[project.scripts]
archdogma = "archdogma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archdogma"]

# The catalog is the product; a wheel without it ships a scanner that
# cannot cite its own receipts. force-include keeps repo-root
# catalog/dogmas.yaml the single source of truth (ADR-002) while placing a
# copy inside the package for installed environments.
[tool.hatch.build.targets.wheel.force-include]
"catalog/dogmas.yaml" = "archdogma/_data/dogmas.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "catalog", "tests", "README.md", "CHANGELOG.md", "LICENSE", "DOGMAS.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
]
