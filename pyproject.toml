[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archdogma"
version = "0.3.0"
description = "Honest static analysis for Python — function, module and git-history detectors, each linked to a catalogued postmortem. The catalog is the point; the scanner finds it in your code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Yegor Gaidar", email = "maingaidar@gmail.com" },
]
keywords = [
    "static-analysis",
    "ast",
    "code-review",
    "accessibility",
    "programming-dogmas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pyttsx3>=2.90",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/gaidar0yegor/ArchDogma"
Repository = "https://github.com/gaidar0yegor/ArchDogma"
Issues = "https://github.com/gaidar0yegor/ArchDogma/issues"
Changelog = "https://github.com/gaidar0yegor/ArchDogma/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The `git` extra held gitpython, planned in ADR-001 for Tier 3. Tier 3
# shipped in 0.3.0 using `subprocess` and one `git log` call, so the extra
# installed a dependency nothing imports. Removed rather than left as a
# no-op install — see ADR-003.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
archdogma = "archdogma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archdogma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
]
