      - god-class     # pending (alpha3+, needs class probe)
      - long-function

  - id: long-parameter-list
    title: "Long Parameter List"
    note: "Classic code smell — when a signature demands too much, it can usually be split into a parameter object, keyword-only namespace, or two different functions."
    sources:
      - title: "Martin Fowler, «Refactoring» (1999/2018) — Long Parameter List"
        url: null
