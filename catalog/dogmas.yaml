# ArchDogma catalog — machine-readable source of truth per ADR-002.
#
# Statuses:
#   stub    = title and definition exist, no cases yet
#   draft   = has a draft honest_verdict, but no real post-mortems
#   filled  = fully filled (for v0.1 — three priority dogmas)
#
# Rules:
#   - every counter_dogma must have attribution (validator — in alpha3)
#   - related_tags — names of Tier 1/2/... detectors that map to this dogma
#   - empty related_tags means: "dogma doesn't exist at function level"
#     (DRY/Microservices — not detectable from a single function, that's honest)

schema_version: 1
updated: 2026-04-30

dogmas:

  # -------------------------------------------------------------------------
  # 1. 100% Test Coverage — stub
  # -------------------------------------------------------------------------
  - id: hundred-percent-coverage
    number: 1
    title: "100% Test Coverage"
    status: draft
    definition: "Everything must be covered by unit tests. Uncovered code is a risk."
    origin: "TDD movement, Kent Beck, Uncle Bob, XP."

    failure_conditions:
      - "Coverage metric gamification: tests that hit every line without asserting meaningful behavior."
      - "UI code, animations, external API calls — impossible or expensive to cover at the unit level."
      - "100% line coverage does not detect logic errors — you can cover every branch of wrong code."
      - "Legacy codebases: retrofitting coverage produces brittle characterization tests."
      - "Test suite becomes slower than the feedback loop developers actually use."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Testing Pyramid"
        attribution: "Mike Cohn, Succeeding with Agile (2009)"
        thesis: "Optimise for 70% unit / 20% integration / 10% E2E — not 100% unit coverage. Different kinds of tests catch different bugs."
      - name: "Test for behaviour, not lines"
        attribution: "Dan North, BDD (2006)"
        thesis: "Coverage as a proxy for quality is the wrong abstraction. A test that asserts nothing can achieve 100% coverage."
      - name: "Characterization Testing"
        attribution: "Michael Feathers, Working Effectively with Legacy Code (2004)"
        thesis: "For legacy without tests: the goal is to lock in current behavior so you can refactor safely — not to document correct behaviour."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Green-field business logic where tests drive design (TDD workflow)."
        - "Critical domains: billing, security, medicine — cost of a missed bug is very high."
        - "Coverage enforcement is a backstop for a team known to skip tests under deadline."
      break_when:
        - "Coverage is used as a quality proxy — a team gaming 100% is worse than a team at 70% with good assertions."
        - "UI, visualization, or integration-heavy code — integration and E2E tests cover this better."
        - "Legacy codebase where coverage retrofit costs exceed the value of the tests produced."
        - "Test suite runtime is already a bottleneck — adding coverage-chasing tests makes it worse."
      main_signal: "Every newly added line of business logic triggers a coverage drill that produces tests with no assertions. That is not safety — that is a number."

    related_tags: []  # requires Tier 4 coverage data, not function level

  # -------------------------------------------------------------------------
  # 2. Clean Architecture / N layers — stub
  # -------------------------------------------------------------------------
  - id: clean-architecture
    number: 2
    title: "Clean Architecture / N Layers of Abstraction"
    status: draft
    definition: "Split code into layers (domain, application, infrastructure, presentation). Dependencies point inward."
    origin: "Uncle Bob, Clean Architecture. Previously Hexagonal/Onion Architecture."

    failure_conditions:
      - "Significant upfront boilerplate: interfaces, adapters, DTOs, mappers — before any business value."
      - "Mapping overhead between layers multiplies the surface area for bugs."
      - "Premature for small teams building simple CRUD apps — architecture tax before architecture benefit."
      - "Confuses structure with discipline: teams add layers but couple them anyway."
      - "Testing becomes harder when every boundary needs a mock or fake."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "MonolithFirst"
        attribution: "Martin Fowler, 2015"
        source_url: "https://martinfowler.com/bliki/MonolithFirst.html"
        thesis: "Start simple; extract layers and services only when the boundary is proven. Early structure for a domain you do not yet understand produces the wrong abstraction."
      - name: "Simple Design"
        attribution: "Kent Beck, Extreme Programming Explained (1999)"
        thesis: "Four rules: passes all tests; communicates intent; no duplication; fewest elements. Architecture emerges from this — it is not imposed."
      - name: "Architecture Decision Records"
        attribution: "Michael Nygard, 2011"
        source_url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions"
        thesis: "Explicit, reversible decisions documented in ADRs beat a mandatory N-layer template."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Multiple teams owning independent layers with different release cycles."
        - "Complex business domain that changes independently of infrastructure."
        - "You have already felt the pain of coupling domain logic to your ORM or HTTP framework."
      break_when:
        - "Team smaller than 5 and single product — overhead of maintaining boundaries is not justified."
        - "Early startup / MVP phase — domain has not stabilised, layers will be the wrong shape."
        - "Mapping between layers is becoming a maintenance burden with no benefit."
        - "Your problem is ops complexity, not domain complexity."
      main_signal: "You spend more time writing mappers between layers than writing business logic. The architecture is consuming the product."

    related_tags: []  # file/module-level concern, not detectable from a single function

  # -------------------------------------------------------------------------
  # 3. DRY — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: dry
    number: 3
    title: "DRY (Don't Repeat Yourself)"
    v01_priority: true
    status: filled
    definition: "Never copy-paste. Any repetition is a candidate for abstraction."
    origin: "«The Pragmatic Programmer», Hunt & Thomas, 1999."

    failure_conditions:
      - "When two similar things are merged into one abstraction and then diverge."
      - "Shared libraries between teams with different release cycles."
      - "Too early abstraction (before the 3rd real use case)."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "WET (Write Everything Twice)"
        attribution: "folk, anonymous"
        thesis: "Don't abstract until you've seen the repetition twice."
      - name: "Rule of Three"
        attribution: "Don Roberts via Martin Fowler, «Refactoring» (1999)"
        thesis: "Three repetitions — only then a candidate for abstraction."
      - name: "The Wrong Abstraction"
        attribution: "Sandi Metz, 2016"
        source_url: "https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction"
        thesis: "Duplication is far cheaper than the wrong abstraction."
      - name: "AHA (Avoid Hasty Abstractions)"
        attribution: "Kent C. Dodds, 2019"
        source_url: "https://kentcdodds.com/blog/aha-programming"
        thesis: "Previously in the catalog AHA was incorrectly attributed to Sandi Metz — these are different authors."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Knowledge repeats (business rule, formula, invariant), not code form."
        - "You see the third repetition (Rule of Three), and all three are called from the same context / same team / same release cycle."
        - "Cost of a wrong abstraction is lower than cost of duplication."
      break_when:
        - "Two code pieces look the same but change for different reasons (different stakeholders, different release cycles, different domains)."
        - "The abstraction crosses team or service boundaries."
        - "There are only 1–2 repetitions and you haven't seen how it actually changes yet."
        - "Code is exploratory / throwaway."
      main_signal: "Every new requirement adds an if-flag to the 'shared' function. That's not extension — that's admission you glued two different things together."

    related_tags:
      - wrong-abstraction  # future Tier 5 — detect via divergent call-sites + if-on-parameter inside shared fn

  # -------------------------------------------------------------------------
  # 4. Microservices — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: microservices
    number: 4
    title: "Microservices for Everything"
    v01_priority: true
    status: filled
    definition: "Monolith is evil. Cut the system into small services."
    origin: "Netflix, Amazon, ThoughtWorks, ~2014."

    failure_conditions:
      - "Team < 10 people."
      - "One product, not independent business units."
      - "Distributed transactions become the norm."
      - "Debug takes 3 hours because traces scatter across 12 services."

    failure_cases: need_postmortems
    success_cases:
      - title: "Netflix, Amazon (at a certain scale)"
        source_url: null
        summary: "Need specific post-mortem links with numbers."

    counter_dogmas:
      - name: "MonolithFirst"
        attribution: "Martin Fowler, 2015"
        source_url: "https://martinfowler.com/bliki/MonolithFirst.html"
        thesis: "Almost all successful microservice systems started as monoliths and were split later."
      - name: "Modular Monolith"
        attribution: "Shopify and others"
        thesis: "Modules with clear boundaries inside one process. No network boundaries, but with the ability to split later."
      - name: "Prime Video monolith migration"
        attribution: "Amazon Prime Video Tech Blog, 2023"
        source_url: "https://www.primevideotech.com/video-streaming/scaling-up-the-prime-video-audio-video-monitoring-service-and-reducing-costs-by-90"
        thesis: "Moving from serverless/microservices back to monolith with 90% reduction in infrastructure costs."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "You genuinely have multiple independent business domains with different teams, release cycles, and scale."
        - "Team is larger than 10–15 people and there's concrete pain from the monolith already."
        - "You're willing to pay the operational cost of a distributed system."
      break_when:
        - "Team < 10 people and/or one product."
        - "Project is in startup / MVP phase — domain hasn't stabilized yet."
        - "Distributed transactions or debug sessions appear where traces scatter across 5+ services."
        - "The main pain is in business logic complexity, not scale."
      main_signal: "Distributed monolith — a bunch of small services that still change together and deploy together, but now over the network."

    related_tags: []  # system level, not detectable from a single function

  # -------------------------------------------------------------------------
  # 5. OOP as the only truth — stub
  # -------------------------------------------------------------------------
  - id: oop-everywhere
    number: 5
    title: "OOP as the Only Truth (inheritance everywhere)"
    status: draft
    definition: "Everything is an object. Inheritance is the primary tool for reuse."
    origin: "Smalltalk, Java, GoF Design Patterns."

    failure_conditions:
      - "Fragile Base Class problem: a change to the parent silently breaks all children."
      - "Inheritance for code reuse creates tight coupling — two different things share a parent because they share a method."
      - "Deep inheritance hierarchies become unreadable: you must trace 5 levels to understand any one method."
      - "Data-heavy pipelines (pandas, numpy, ETL) are cleaner with functions than with object hierarchies."
      - "Go, Rust, Haskell — languages with no inheritance at all produce production-quality systems."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Composition over Inheritance"
        attribution: "GoF (Gang of Four), Design Patterns (1994)"
        thesis: "The GoF book itself recommends preferring composition — the patterns that made OOP famous mostly avoid deep inheritance."
      - name: "Favour composition over inheritance"
        attribution: "Joshua Bloch, Effective Java (2001), Item 16"
        thesis: "Inheritance is appropriate only in is-a relationships. Reuse via composition is safer and more flexible."
      - name: "Functional Programming renaissance"
        attribution: "Haskell, Clojure, Elm, Rust communities — 2010s"
        thesis: "Type classes, traits, and algebraic data types achieve polymorphism without inheritance. The paradigm works at production scale."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "True is-a hierarchies: GUI widgets, plugin frameworks, protocol implementations."
        - "Team is homogeneous in OOP experience and the domain maps naturally to objects."
        - "Framework demands it (Django models, Flask extensions)."
      break_when:
        - "Inheritance is used for code reuse, not is-a modelling."
        - "Subclasses override most parent methods — the hierarchy is not earning its keep."
        - "Mixins are piling up to compose behaviors — that is composition with extra confusion."
        - "Data-heavy code: functions over dataclasses are clearer than method-heavy classes."
      main_signal: "You cannot add a new subclass without reading and understanding the full parent chain. That is coupling, not extensibility."

    related_tags:
      - deep-inheritance  # pending Tier 1 detector (class-level walker, alpha4+)

  # -------------------------------------------------------------------------
  # 6. TDD — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: tdd
    number: 6
    title: "TDD (Test-Driven Development)"
    v01_priority: true
    status: filled
    definition: "Red-Green-Refactor. Write the test first, then the code."
    origin: "Kent Beck."

    failure_conditions:
      - "Unknown domain — you don't yet know what the API should look like."
      - "UI code, visualizations."
      - "Research / exploratory coding."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Spike First"
        attribution: "Kent Beck, «Extreme Programming Explained» (1999)"
        thesis: "In an unknown domain, first a spike (throwaway prototype without tests), then discard it, then rewrite with TDD."
      - name: "Test After / Test Last"
        attribution: "folk, counter-practice"
        thesis: "Tests are written after implementation, when the API has stabilized. Domain: UI, exploratory, research."
      - name: "Characterization Testing"
        attribution: "Michael Feathers, «Working Effectively with Legacy Code» (2004)"
        thesis: "For legacy without tests: test locks in current behavior so you can refactor safely."
      - name: "TDD is dead. Long live testing."
        attribution: "DHH (David Heinemeier Hansson), 2014"
        source_url: "https://dhh.dk/2014/tdd-is-dead-long-live-testing.html"
        thesis: "TDD as ideology led to over-mocking and designing for tests instead of designing for the problem."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "You already understand the domain and roughly know what the API should look like."
        - "Working on stable business logic you plan to refactor."
        - "Cost of a production error is very high (finance, security, medicine, billing)."
      break_when:
        - "You're in an unknown domain — use Spike First."
        - "Working with UI, complex visual states, or external integrations — Test After."
        - "Working with legacy without tests — Characterization Testing."
        - "Prototype / proof of concept that will be thrown away in a week."
      main_signal: "You write a test before you understood what the code should do. Result — well-tested wrong design + a forest of mocks."

    related_tags: []  # requires Tier 4 (coverage + test structure), not static function analysis

  # -------------------------------------------------------------------------
  # 7. SOLID as law — stub
  # -------------------------------------------------------------------------
  - id: solid
    number: 7
    title: "SOLID as Law"
    status: draft
    definition: "SRP, OCP, LSP, ISP, DIP — five principles all code must follow."
    origin: "Uncle Bob, 2000s."

    failure_conditions:
      - "SRP interpreted too narrowly: micro-classes with one method each; a single feature touches 20 files."
      - "OCP applied pre-emptively: extension points for behaviours that never change add dead abstraction."
      - "DIP everywhere: an interface for every class even when only one implementation exists."
      - "ISP applied too early: explosion of tiny interfaces that mirror exactly one caller."
      - "SOLID used as a checklist to pass code review rather than as a tool for solving real coupling problems."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Simple Design (Beck 4 Rules)"
        attribution: "Kent Beck, Extreme Programming Explained (1999)"
        thesis: "Passes tests; communicates intent; no duplication; fewest elements. SOLID emerges from this naturally — it is not a starting constraint."
      - name: "CUPID — properties over principles"
        attribution: "Dan North, 2022"
        source_url: "https://dannorth.net/cupid-for-joyful-coding/"
        thesis: "SOLID is too prescriptive. CUPID (Composable, Unix-philosophy, Predictable, Idiomatic, Domain-based) describes properties of good code, not rules to enforce."
      - name: "Shotgun Surgery anti-pattern"
        attribution: "Martin Fowler, Refactoring (1999)"
        thesis: "Over-applying SRP produces shotgun surgery: a single change scatters edits across many files. The smell has a name — it is a known failure mode of excessive decomposition."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Large codebase with multiple teams — stable boundaries prevent cross-team coupling."
        - "Extension points that genuinely exist: multiple payment providers, multiple storage backends."
        - "Team explicitly needs shared vocabulary for code review."
      break_when:
        - "Single-person or two-person project — overhead of interfaces and injection is not justified."
        - "CRUD application where the domain rarely changes."
        - "Early prototype: applying OCP/DIP before the abstractions are proven produces the wrong design."
        - "Checklist-driven reviews: SOLID as a gate for merges degrades into cargo-culting."
      main_signal: "Adding a new feature requires creating an interface, an implementation, a factory, and a registration entry — but there is only one implementation and there never will be a second."

    related_tags: []  # SOLID is at class/module level; not detectable from single function AST

  # -------------------------------------------------------------------------
  # 8. Self-documenting code — stub
  # -------------------------------------------------------------------------
  - id: self-documenting-code
    number: 8
    title: "Self-documenting code (no comments needed)"
    status: draft
    definition: "Good code reads without comments. Comments are a sign of unclear code."
    origin: "Uncle Bob, Clean Code."

    failure_conditions:
      - "Domain knowledge that code cannot convey: why this algorithm was chosen over alternatives."
      - "Non-obvious invariants: this function assumes X has already been called."
      - "Performance tricks that look wrong but are intentionally correct."
      - "Regulatory requirements or legal constraints that require prose explanation."
      - "The rule becomes remove all comments even when the WHY is genuinely non-obvious."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Comment the WHY, not the WHAT"
        attribution: "The Pragmatic Programmer, Hunt and Thomas (1999)"
        thesis: "Comments explaining intent, constraints, and tradeoffs are valuable. Comments restating the code are noise. The distinction is the point — not no comments."
      - name: "Literate Programming"
        attribution: "Donald Knuth, 1984"
        thesis: "Code and prose belong together. Complex algorithms need mathematical explanations that code syntax cannot provide."
      - name: "Architecture Decision Records"
        attribution: "Michael Nygard, 2011"
        source_url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions"
        thesis: "The most critical documentation is not inside functions — it is the decision log explaining why the system is shaped the way it is."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Naming is rich enough to express intent: domain concepts map clearly to identifiers."
        - "Team shares deep domain knowledge — no onboarding gap that prose would close."
        - "Code is straightforward CRUD or data transformation with no non-obvious correctness requirements."
      break_when:
        - "The WHY is genuinely non-obvious: performance constraints, workarounds, legal obligations."
        - "Algorithm has non-obvious correctness requirements (cryptography, numerical stability, concurrency)."
        - "Team turns over and onboarding time matters — good comments reduce the knowledge cliff."
        - "An invariant cannot be expressed as a type or a name: add a comment."
      main_signal: "A new team member reads the function and understands WHAT it does, but not WHY it exists, WHY this approach, or WHY the seemingly wrong constant is correct."

    related_tags: []  # comment density is not in the AST; would need Tier 3/4 analysis

  # -------------------------------------------------------------------------
  # 9. Premature optimization — stub
  # -------------------------------------------------------------------------
  - id: premature-optimization
    number: 9
    title: "Premature optimization is the root of all evil"
    status: draft
    definition: "Don't optimize until you've profiled. (Usually cited without context.)"
    origin: "Donald Knuth, 1974. Full quote: We should forget about small efficiencies, say about 97% of the time: premature optimization is the root of all evil. Yet we should not pass up our opportunities in that critical 3%."

    failure_conditions:
      - "The quote is weaponised to avoid thinking about performance entirely — we will optimise later becomes never."
      - "Ignores Knuth's own 3%: structural decisions (O(n^2) vs O(n log n)) are design, not premature optimisation."
      - "Retry counts, connection pool sizes, timeout values — foundational, not premature."
      - "Latency as a product constraint from day 1 (trading systems, real-time games) — not a post-hoc concern."
      - "The culture becomes always defer and the team never develops performance intuition."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Profile-Driven Development"
        attribution: "Brendan Gregg, Systems Performance (2013/2020)"
        thesis: "The correct reading of Knuth is: measure first, then optimise the bottleneck. The tool is profiling, not the quote."
      - name: "Algorithmic thinking is design, not optimisation"
        attribution: "folk (CS pedagogy)"
        thesis: "Choosing O(n log n) over O(n^2) is not premature optimisation — it is selecting the right algorithm. Conflating the two is a misreading of Knuth."
      - name: "Performance budgets"
        attribution: "Google Web Vitals / Lighthouse team"
        thesis: "For user-facing latency, performance is a feature constraint defined upfront, not an optimisation discovered post-launch."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "You have correct, readable code and no profiling data — do not optimise yet."
        - "Code clarity is genuinely at stake: the optimisation makes the code harder to reason about."
        - "The hotpath has not been identified — any guess about where time is spent is probably wrong."
      break_when:
        - "You are choosing between algorithms: O(n^2) vs O(n log n) is a design decision, not an optimisation."
        - "Latency budget is a product constraint defined before writing any code."
        - "You have profiling data showing a specific bottleneck — now optimise that bottleneck deliberately."
        - "Infrastructure constants (timeouts, pool sizes, batch sizes) must be sized correctly from the start."
      main_signal: "The codebase has no performance tests, no profiling history, and the team calls every performance concern premature. The quote has become a reason not to think."

    related_tags: []  # not detectable from single-function AST; would need Tier 4 (profiling data)

  # -------------------------------------------------------------------------
  # 10. Functional purity / Immutability — stub
  # -------------------------------------------------------------------------
  - id: functional-purity
    number: 10
    title: "Functional purity / Immutability everywhere"
    status: draft
    definition: "Avoid mutations. Pure functions. No side effects."
    origin: "Haskell community, FP renaissance of the 2010s, React/Redux."

    failure_conditions:
      - "Immutability + large data structures leads to garbage collection pressure (copy-on-write overhead)."
      - "Pure FP in inherently stateful systems (web servers, UIs, databases) adds monad-wrapping indirection."
      - "Monad chains for IO in non-Haskell languages (Python, JS) become harder to read than equivalent imperative code."
      - "Go, Python, JavaScript: pure FP style is non-idiomatic and creates friction for developers joining the team."
      - "Redux-everywhere in UIs: global immutable state for local component state that changes many times per second."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Practical Functional Programming"
        attribution: "Scott Wlaschin, F# for Fun and Profit (2012-present)"
        source_url: "https://fsharpforfunandprofit.com/"
        thesis: "Apply functional style where it pays off (data transformations, business rules); use mutation where it is the natural model (state machines, I/O)."
      - name: "Object-Functional hybrids"
        attribution: "Scala, Kotlin communities"
        thesis: "Immutable value objects for domain logic + mutable infrastructure code. Neither pure OOP nor pure FP — pragmatic composition."
      - name: "Local mutation is fine"
        attribution: "Effective Python, Brett Slatkin; Rust ownership model"
        thesis: "Mutation scoped to a function body (local variable reassignment, list building then return) has no observable side effect. Immutability matters at the boundary, not inside a local scope."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Pure business logic computation: data transformations, validations, calculations — benefit from testability and referential transparency."
        - "Shared mutable state is causing bugs — immutability is the surgical fix."
        - "Concurrent code where shared mutation causes races."
      break_when:
        - "Inherently stateful domain: session management, stream processing, event loops."
        - "Immutability overhead (copy-on-write) is measurable in profiling data."
        - "Team is unfamiliar with FP idioms — forcing purity creates unreadable code that nobody maintains."
        - "Framework requires mutation (ORM, UI component state)."
      main_signal: "Every function that has a side effect wraps it in a monad or callback chain. The type system is correct; the code is unreadable."

    related_tags:
      - mutable-default-arg  # Python: mutable default is a mutability violation at the signature level

  # -------------------------------------------------------------------------
  # 11. KISS (Keep It Simple, Stupid) — draft
  # -------------------------------------------------------------------------
  - id: kiss
    number: 11
    title: "KISS (Keep It Simple, Stupid)"
    status: draft
    definition: >
      Prefer simple solutions over complex ones. Complexity is the enemy.
      Remove everything that isn't strictly necessary.
    origin: >
      U.S. Navy, 1960. Kelly Johnson (Lockheed Skunk Works) insisted aircraft
      be repairable in combat with basic tools. Software adoption via Unix
      philosophy («Do one thing well») and later «Clean Code» culture.

    failure_conditions:
      - "KISS used as a reason to avoid thinking deeply about the problem."
      - "Simplicity of implementation confused with simplicity of the model."
      - "Removing real complexity that the domain actually has — just hiding it elsewhere."
      - "Team conflates 'familiar' with 'simple'."
      - "'Stupid' in the slogan is taken literally — optimizing for the dumbest solution, not the clearest one."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Simple but Smart = Genius"
        attribution: "Yegor Gaidar, 2026 (ArchDogma issue ARC-222)"
        thesis: >
          KISS without intelligence produces dumb simplicity. Real mastery is
          achieving simple interfaces over genuinely complex systems — not
          pretending complexity doesn't exist. Minecraft: one voxel, infinite
          depth. Einstein: «Everything should be made as simple as possible,
          but not simpler.»
      - name: "Simple Made Easy"
        attribution: "Rich Hickey, Strange Loop 2011"
        source_url: "https://www.infoq.com/presentations/Simple-Made-Easy/"
        thesis: >
          «Simple» (few interleaved concerns) ≠ «easy» (familiar/convenient).
          Easy solutions can be complected. The goal is simplicity of the model,
          not ease of the implementation.
      - name: "Worse Is Better"
        attribution: "Richard Gabriel, 1989"
        source_url: "https://www.dreamsongs.com/WIB.html"
        thesis: >
          The «New Jersey style» — simple implementation, imperfect interface —
          often wins in practice over the «MIT style» correct-interface design.
          A warning that KISS can be weaponized to ship deliberately incomplete
          things.

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Two designs solve the same problem — pick the one with fewer moving parts."
        - "Complexity is coming from your design choices, not from the domain."
        - "You can remove something and the system still correctly handles all real cases."
      break_when:
        - "The problem is genuinely complex — KISS doesn't simplify the problem, just hides it."
        - "You're simplifying the wrong layer (impl) while complicating the right one (API/model)."
        - "The 'simple' solution requires callers to carry the complexity you refused to encode."
        - "You're optimizing for lines of code, not for conceptual clarity."
      main_signal: >
        Every new edge case requires a workaround in the calling code. Your
        'simple' core is pushing complexity outward — that's not KISS, that's
        a tax on every consumer.

    related_tags: []  # cross-cutting concern; not detectable from a single function

