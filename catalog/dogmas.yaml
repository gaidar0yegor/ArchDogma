# ArchDogma catalog — machine-readable source of truth per ADR-002.
#
# Statuses:
#   stub    = title and definition exist, no cases yet
#   draft   = has a draft honest_verdict, but no real post-mortems
#   filled  = fully filled (for v0.1 — three priority dogmas)
#
# Rules:
#   - every counter_dogma must have attribution (validator — in alpha3)
#   - related_tags — names of Tier 1/2/... detectors that map to this dogma
#   - empty related_tags means: "dogma doesn't exist at function level"
#     (DRY/Microservices — not detectable from a single function, that's honest)

schema_version: 1
updated: 2026-04-30

dogmas:

  # -------------------------------------------------------------------------
  # 1. 100% Test Coverage — stub
  # -------------------------------------------------------------------------
  - id: hundred-percent-coverage
    number: 1
    title: "100% Test Coverage"
    status: stub
    definition: "Everything must be covered by unit tests. Uncovered code is a risk."
    origin: "TDD movement, Kent Beck, Uncle Bob, XP."
    related_tags: []  # requires Tier 4 coverage data, not function level

  # -------------------------------------------------------------------------
  # 2. Clean Architecture / N layers — stub
  # -------------------------------------------------------------------------
  - id: clean-architecture
    number: 2
    title: "Clean Architecture / N Layers of Abstraction"
    status: stub
    definition: "Split code into layers (domain, application, infrastructure, presentation). Dependencies point inward."
    origin: "Uncle Bob, «Clean Architecture». Previously Hexagonal/Onion Architecture."
    related_tags: []  # file/module-level, not function

  # -------------------------------------------------------------------------
  # 3. DRY — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: dry
    number: 3
    title: "DRY (Don't Repeat Yourself)"
    v01_priority: true
    status: filled
    definition: "Never copy-paste. Any repetition is a candidate for abstraction."
    origin: "«The Pragmatic Programmer», Hunt & Thomas, 1999."

    failure_conditions:
      - "When two similar things are merged into one abstraction and then diverge."
      - "Shared libraries between teams with different release cycles."
      - "Too early abstraction (before the 3rd real use case)."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "WET (Write Everything Twice)"
        attribution: "folk, anonymous"
        thesis: "Don't abstract until you've seen the repetition twice."
      - name: "Rule of Three"
        attribution: "Don Roberts via Martin Fowler, «Refactoring» (1999)"
        thesis: "Three repetitions — only then a candidate for abstraction."
      - name: "The Wrong Abstraction"
        attribution: "Sandi Metz, 2016"
        source_url: "https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction"
        thesis: "Duplication is far cheaper than the wrong abstraction."
      - name: "AHA (Avoid Hasty Abstractions)"
        attribution: "Kent C. Dodds, 2019"
        source_url: "https://kentcdodds.com/blog/aha-programming"
        thesis: "Previously in the catalog AHA was incorrectly attributed to Sandi Metz — these are different authors."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "Knowledge repeats (business rule, formula, invariant), not code form."
        - "You see the third repetition (Rule of Three), and all three are called from the same context / same team / same release cycle."
        - "Cost of a wrong abstraction is lower than cost of duplication."
      break_when:
        - "Two code pieces look the same but change for different reasons (different stakeholders, different release cycles, different domains)."
        - "The abstraction crosses team or service boundaries."
        - "There are only 1–2 repetitions and you haven't seen how it actually changes yet."
        - "Code is exploratory / throwaway."
      main_signal: "Every new requirement adds an if-flag to the 'shared' function. That's not extension — that's admission you glued two different things together."

    related_tags:
      - wrong-abstraction  # future Tier 5 — detect via divergent call-sites + if-on-parameter inside shared fn

  # -------------------------------------------------------------------------
  # 4. Microservices — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: microservices
    number: 4
    title: "Microservices for Everything"
    v01_priority: true
    status: filled
    definition: "Monolith is evil. Cut the system into small services."
    origin: "Netflix, Amazon, ThoughtWorks, ~2014."

    failure_conditions:
      - "Team < 10 people."
      - "One product, not independent business units."
      - "Distributed transactions become the norm."
      - "Debug takes 3 hours because traces scatter across 12 services."

    failure_cases: need_postmortems
    success_cases:
      - title: "Netflix, Amazon (at a certain scale)"
        source_url: null
        summary: "Need specific post-mortem links with numbers."

    counter_dogmas:
      - name: "MonolithFirst"
        attribution: "Martin Fowler, 2015"
        source_url: "https://martinfowler.com/bliki/MonolithFirst.html"
        thesis: "Almost all successful microservice systems started as monoliths and were split later."
      - name: "Modular Monolith"
        attribution: "Shopify and others"
        thesis: "Modules with clear boundaries inside one process. No network boundaries, but with the ability to split later."
      - name: "Prime Video monolith migration"
        attribution: "Amazon Prime Video Tech Blog, 2023"
        source_url: "https://www.primevideotech.com/video-streaming/scaling-up-the-prime-video-audio-video-monitoring-service-and-reducing-costs-by-90"
        thesis: "Moving from serverless/microservices back to monolith with 90% reduction in infrastructure costs."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "You genuinely have multiple independent business domains with different teams, release cycles, and scale."
        - "Team is larger than 10–15 people and there's concrete pain from the monolith already."
        - "You're willing to pay the operational cost of a distributed system."
      break_when:
        - "Team < 10 people and/or one product."
        - "Project is in startup / MVP phase — domain hasn't stabilized yet."
        - "Distributed transactions or debug sessions appear where traces scatter across 5+ services."
        - "The main pain is in business logic complexity, not scale."
      main_signal: "Distributed monolith — a bunch of small services that still change together and deploy together, but now over the network."

    related_tags: []  # system level, not detectable from a single function

  # -------------------------------------------------------------------------
  # 5. OOP as the only truth — stub
  # -------------------------------------------------------------------------
  - id: oop-everywhere
    number: 5
    title: "OOP as the Only Truth (inheritance everywhere)"
    status: stub
    definition: "Everything is an object. Inheritance is the primary tool for reuse."
    origin: "Smalltalk, Java, GoF Design Patterns."
    related_tags:
      - deep-inheritance  # future Tier 1 detector

  # -------------------------------------------------------------------------
  # 6. TDD — v0.1 priority, filled
  # -------------------------------------------------------------------------
  - id: tdd
    number: 6
    title: "TDD (Test-Driven Development)"
    v01_priority: true
    status: filled
    definition: "Red-Green-Refactor. Write the test first, then the code."
    origin: "Kent Beck."

    failure_conditions:
      - "Unknown domain — you don't yet know what the API should look like."
      - "UI code, visualizations."
      - "Research / exploratory coding."

    failure_cases: need_postmortems
    success_cases: need_data

    counter_dogmas:
      - name: "Spike First"
        attribution: "Kent Beck, «Extreme Programming Explained» (1999)"
        thesis: "In an unknown domain, first a spike (throwaway prototype without tests), then discard it, then rewrite with TDD."
      - name: "Test After / Test Last"
        attribution: "folk, counter-practice"
        thesis: "Tests are written after implementation, when the API has stabilized. Domain: UI, exploratory, research."
      - name: "Characterization Testing"
        attribution: "Michael Feathers, «Working Effectively with Legacy Code» (2004)"
        thesis: "For legacy without tests: test locks in current behavior so you can refactor safely."
      - name: "TDD is dead. Long live testing."
        attribution: "DHH (David Heinemeier Hansson), 2014"
        source_url: "https://dhh.dk/2014/tdd-is-dead-long-live-testing.html"
        thesis: "TDD as ideology led to over-mocking and designing for tests instead of designing for the problem."

    honest_verdict:
      status: draft_awaiting_cases
      follow_when:
        - "You already understand the domain and roughly know what the API should look like."
        - "Working on stable business logic you plan to refactor."
        - "Cost of a production error is very high (finance, security, medicine, billing)."
      break_when:
        - "You're in an unknown domain — use Spike First."
        - "Working with UI, complex visual states, or external integrations — Test After."
        - "Working with legacy without tests — Characterization Testing."
        - "Prototype / proof of concept that will be thrown away in a week."
      main_signal: "You write a test before you understood what the code should do. Result — well-tested wrong design + a forest of mocks."

    related_tags: []  # requires Tier 4 (coverage + test structure), not static function analysis

