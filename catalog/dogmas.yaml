candidates:
  - id: god-class
    title: "God File / God Class"
    note: "Anti-pattern consequence, not a dogma. Appears from fear of refactoring + no tests + deadlines."
    sources:
      - title: "SQLite amalgamation — deliberate performance decision (~238k lines)"
        url: "https://sqlite.org/amalgamation.html"
      - title: "Knight Capital 2012 — $440M from dead code in legacy"
        url: "https://www.sec.gov/litigation/admin/2013/34-70694.pdf"
