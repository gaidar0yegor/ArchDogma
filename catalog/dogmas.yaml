        url: "https://docs.python.org/3/faq/programming.html#why-are-default-values-shared-between-objects"
      - title: "pylint W0102 — Dangerous default value"
        url: null
      - title: "flake8-bugbear B006 — Do not use mutable data structures for argument defaults"
        url: "https://github.com/PyCQA/flake8-bugbear"
