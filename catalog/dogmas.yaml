        url: "https://peps.python.org/pep-0008/#programming-recommendations"
      - title: "pylint W0703 — Catching too general exception"
        url: null
      - title: "flake8-bugbear B001 — bare except"
        url: "https://github.com/PyCQA/flake8-bugbear"
    related_tags:
      - broad-except

  - id: mutable-default-argument
    title: "Mutable Default Argument"
    note: "Classic Python gotcha: mutable default values (list, dict, set) are shared across all calls. Use None as sentinel."
    sources:
